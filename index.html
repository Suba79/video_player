
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой видеоплеер</title>

    <link rel="icon"
          type="image/svg+xml"
          href="favicon.svg">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap">

    <style>
        .player {
            width: 800px;
            height: 600px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px 3px rgba(0, 0, 0, 0.4);
        }

        .player-video {
            flex-grow: 1;
            min-height: 0;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 4px 0 0;
            height: 44px;
            background-color: black;
            flex-shrink: 0;
        }

        .player-button {
            box-sizing: border-box;
            border: none;
            cursor: pointer;
            background-color: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }

        .player-button[hidden] {
            display: none;
        }

        .player-icon {
            display: block;
            color: white;
            font-size: 20px;
            line-height: 1;
        }

        .player-time {
            color: white;
            font-family: "Roboto", sans-serif;
            font-size: 16px;
            font-weight: 400;
            white-space: nowrap;
        }

        .player-current-time {
            margin-left: 4px;
            transform: translateX(-3px);
        }

        .player-progress {
            display: flex;
            align-items: center;
            flex-grow: 1;
            min-width: 0;
            height: 20px;
            background-color: transparent;
            cursor: pointer;
        }

        .player-progress-filled {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            flex-shrink: 0;
            min-width: 0;
            width: 0;
            height: 5px;
            background-color: #f8104d;
            border-radius: 4px;
        }

        .progress-thumb {
            box-sizing: border-box;
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            margin-right: -7px;
            background-color: #f8104d;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(0, 0, 0, 0.6);
            cursor: pointer;

            opacity: 0;
        }

        .player-progress:hover .progress-thumb {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="player" class="player">

        <div class="js-video-container player-video"></div>

        <div class="player-controls">

            <button type="button"
                    class="js-play-button player-button"
                    aria-label="Воспроизвести видео">
                <i class="fa fa-play player-icon"
                   aria-hidden="true"></i>
            </button>

            <button type="button"
                    class="js-pause-button player-button"
                    aria-label="Приостановить видео"
                    hidden>
                <i class="fa fa-pause player-icon"
                   aria-hidden="true"></i>
            </button>

            <button type="button"
                    class="js-mute-button player-button"
                    aria-label="Выключить звук">
                <i class="fa fa-volume-up player-icon"
                   aria-hidden="true"></i>
            </button>

            <button type="button"
                    class="js-volume-button player-button"
                    aria-label="Включить звук"
                    hidden>
                <i class="fa fa-volume-off player-icon"
                   aria-hidden="true"></i>
            </button>

            <div class="player-time player-current-time"
                 aria-label="Текущее время">
                <span class="js-current-time">0:00:00</span>
            </div>

            <div class="js-progress player-progress"
                 aria-label="Полоса прокрутки видео">

                <div class="js-progress-slider player-progress-filled">
                    <div class="progress-thumb"
                         aria-hidden="true"></div>
                </div>

            </div>

            <div class="player-time"
                 aria-label="Продолжительность видео">
                <span class="js-duration">0:00:00</span>
            </div>

            <button type="button"
                    class="js-fullscreen-button player-button"
                    aria-label="На весь экран">
                <i class="fa fa-expand player-icon"
                   aria-hidden="true"></i>
            </button>

        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>
    <script src="player.js"></script>

    <script>
        createPlayer({elementId: 'player'});
    </script>

</body>
</html>
