
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой видеоплеер</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        .player {
            width: 800px;
            height: 500px;
        }

        .player-video {
            width: 100%;
            height: 450px;
        }

        .player-controls {
            background-color: black;
            height: 50px;
        }

        .player-button {
            border: none;
            cursor: pointer;
            background-color: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            vertical-align: middle;
            width: 32px;
            height: 32px;
        }

        .player-button[hidden] {
            display: none;
        }

        .player-icon {
            color: white;
        }
    </style>
</head>
<body>

    <div id="player" class="player">

        <div class="js-video-container player-video">
        </div>

        <div class="player-controls">

            <button type="button"
                    class="js-play-button player-button"
                    aria-label="Воспроизвести видео">
                <i class="fa fa-play player-icon"
                   aria-hidden="true"></i>
            </button>

            <button type="button"
                    class="js-pause-button player-button"
                    aria-label="Приостановить видео"
                    hidden>
                <i class="fa fa-pause player-icon"
                   aria-hidden="true"></i>
            </button>

        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>
    <script src="player.js"></script>

    <script>
        createPlayer({elementId: 'player'});
    </script>

</body>
</html>
