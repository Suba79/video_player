
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой видеоплеер</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>

    <div id="player" style="width: 800px; height: 500px;">

        <div class="js-video-container"
             style="width: 100%; height: 450px;">
        </div>

        <div style="background-color: black; height: 50px;">

            <button type="button"
                    style="border: none;
                           cursor: pointer;
                           background-color: transparent;
                           display: inline-flex;
                           align-items: center;
                           justify-content: center;
                           vertical-align: middle;"
                    aria-label="Воспроизвести видео">
                <i class="fa fa-play"
                   style="color: white;"
                   aria-hidden="true"></i>
            </button>

            <button type="button"
                    style="border: none;
                           cursor: pointer;
                           background-color: transparent;
                           display: inline-flex;
                           align-items: center;
                           justify-content: center;
                           vertical-align: middle;"
                    aria-label="Приостановить видео">
                <i class="fa fa-pause"
                   style="color: white;"
                   aria-hidden="true"></i>
            </button>

        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>
    <script src="player.js"></script>

    <script>
        createPlayer({elementId: 'player'});
    </script>

</body>
</html>
