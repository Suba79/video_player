
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой видеоплеер</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        .player {
            width: 800px;
            height: 500px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 10px 3px rgba(0, 0, 0, 0.4);
        }

        .player-video {
            flex-grow: 1;
            min-height: 0;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 8px;
            background-color: black;
            flex-shrink: 0;
        }

        .player-button {
            box-sizing: border-box;
            border: none;
            cursor: pointer;
            background-color: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            flex-shrink: 0;
        }

        .player-button[hidden] {
            display: none;
        }

        .player-icon {
            display: block;
            color: white;
            font-size: 20px;
            line-height: 1;
        }

        .player-volume-icon {
            font-size: 22px;
        }

        .player-controls-spacer {
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <div id="player" class="player">

        <div class="js-video-container player-video">
        </div>

        <div class="player-controls">

            <button type="button"
                    class="js-play-button player-button"
                    aria-label="Воспроизвести видео">
                <i class="fa fa-play player-icon"
                   aria-hidden="true"></i>
            </button>

            <button type="button"
                    class="js-pause-button player-button"
                    aria-label="Приостановить видео"
                    hidden>
                <i class="fa fa-pause player-icon"
                   aria-hidden="true"></i>
            </button>

            <button type="button"
                    class="js-mute-button player-button"
                    aria-label="Выключить звук">
                <i class="fa fa-volume-up player-icon player-volume-icon"
                   aria-hidden="true"></i>
            </button>

            <button type="button"
                    class="js-volume-button player-button"
                    aria-label="Включить звук"
                    hidden>
                <i class="fa fa-volume-off player-icon player-volume-icon"
                   aria-hidden="true"></i>
            </button>

            <div class="player-controls-spacer"
                 aria-hidden="true"></div>

            <button type="button"
                    class="js-fullscreen-button player-button"
                    aria-label="На весь экран">
                <i class="fa fa-expand player-icon"
                   aria-hidden="true"></i>
            </button>

        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>
    <script src="player.js"></script>

    <script>
        createPlayer({elementId: 'player'});
    </script>

</body>
</html>
